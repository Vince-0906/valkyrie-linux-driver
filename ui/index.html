<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:,"/>
<title>VALKYRIE C360 // 水冷控制终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#e0e5ec;
  --text:#5a6c7d;
  --text-dark:#3c4043;
  --text-light:#a3b1c6;
  --accent:#667eea;
  --accent2:#764ba2;
  --green:#34a853;
  --red:#ea4335;
  --amber:#fbbc04;
}

html[data-theme="dark"]{
  --bg:#1a1d2e;
  --text:#c7d2e8;
  --text-dark:#e8eef9;
  --text-light:#8b95ab;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --green:#10b981;
  --red:#ef4444;
  --amber:#f59e0b;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:32px 24px;
  transition:background .3s;
}

/* Soft UI Shadows */
.soft-raised{
  box-shadow:
    10px 10px 20px rgba(163,177,198,0.6),
    -10px -10px 20px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .soft-raised{
  box-shadow:
    8px 8px 16px rgba(0,0,0,0.4),
    -8px -8px 16px rgba(45,52,80,0.3);
}
.soft-inset{
  box-shadow:
    inset 5px 5px 10px rgba(163,177,198,0.5),
    inset -5px -5px 10px rgba(255,255,255,0.7);
}
html[data-theme="dark"] .soft-inset{
  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,0.5),
    inset -4px -4px 8px rgba(45,52,80,0.2);
}
.soft-hover:hover{
  box-shadow:
    12px 12px 24px rgba(163,177,198,0.7),
    -12px -12px 24px rgba(255,255,255,0.9);
  transform:translateY(-2px);
}
html[data-theme="dark"] .soft-hover:hover{
  box-shadow:
    10px 10px 20px rgba(0,0,0,0.5),
    -10px -10px 20px rgba(45,52,80,0.4);
  transform:translateY(-2px);
}

/* Container */
.container{max-width:1600px;margin:0 auto;padding:0 8px}

/* Header */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:36px;
  background:var(--bg);
  padding:24px 32px;
  border-radius:24px;
  box-shadow:
    8px 8px 16px rgba(163,177,198,0.5),
    -8px -8px 16px rgba(255,255,255,0.8);
}
html[data-theme="dark"] header{
  box-shadow:
    6px 6px 12px rgba(0,0,0,0.4),
    -6px -6px 12px rgba(45,52,80,0.2);
}
.logo{display:flex;align-items:center;gap:16px}
.logo-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;
  box-shadow:
    6px 6px 12px rgba(102,126,234,0.4),
    -4px -4px 8px rgba(255,255,255,0.2);
}
.logo-text{font-size:20px;font-weight:700;color:var(--text-dark);line-height:1.3}
.logo-text small{display:block;font-size:12px;color:var(--text-light);font-weight:400;margin-top:3px}

.header-right{display:flex;align-items:center;gap:16px}
.status-chip{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;background:var(--bg);border-radius:24px;
  font-size:14px;font-weight:600;
  box-shadow:
    inset 3px 3px 6px rgba(163,177,198,0.4),
    inset -3px -3px 6px rgba(255,255,255,0.7);
}
.status-dot{width:10px;height:10px;border-radius:50%;
  box-shadow:0 0 8px currentColor}
.status-dot.on{background:var(--green);color:var(--green)}
.status-dot.off{background:var(--red);color:var(--red)}
.status-dot.wait{background:var(--amber);color:var(--amber)}

.settings-btn{
  width:52px;height:52px;border-radius:14px;
  background:var(--bg);border:none;cursor:pointer;
  font-size:22px;color:var(--text);
  transition:all .3s;
  box-shadow:
    6px 6px 12px rgba(163,177,198,0.6),
    -6px -6px 12px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .settings-btn{
  box-shadow:
    5px 5px 10px rgba(0,0,0,0.4),
    -5px -5px 10px rgba(45,52,80,0.2);
}
.settings-btn:hover{
  box-shadow:
    8px 8px 16px rgba(163,177,198,0.7),
    -8px -8px 16px rgba(255,255,255,0.9);
  transform:scale(1.05);
  color:var(--accent);
}
html[data-theme="dark"] .settings-btn:hover{
  box-shadow:
    7px 7px 14px rgba(0,0,0,0.5),
    -7px -7px 14px rgba(45,52,80,0.3);
  transform:scale(1.05);
  color:var(--accent);
}
.settings-btn:active{
  box-shadow:
    inset 5px 5px 10px rgba(163,177,198,0.6),
    inset -5px -5px 10px rgba(255,255,255,0.5);
  transform:scale(0.98);
}
html[data-theme="dark"] .settings-btn:active{
  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,0.5),
    inset -4px -4px 8px rgba(45,52,80,0.2);
  transform:scale(0.98);
}

/* Settings Panel */
.settings-panel{
  position:fixed;top:110px;right:24px;width:280px;
  background:var(--bg);border-radius:20px;padding:20px;
  display:none;z-index:100;
  box-shadow:
    10px 10px 20px rgba(163,177,198,0.7),
    -10px -10px 20px rgba(255,255,255,0.9);
}
html[data-theme="dark"] .settings-panel{
  box-shadow:
    8px 8px 16px rgba(0,0,0,0.5),
    -8px -8px 16px rgba(45,52,80,0.3);
}
.settings-panel.open{display:block;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.setting-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;
}
.setting-row + .setting-row{border-top:1px solid rgba(163,177,198,0.2)}
.setting-label{font-size:13px;font-weight:600;color:var(--text-dark)}
.setting-btns{display:flex;gap:8px}
.setting-btns button{
  padding:7px 14px;background:var(--bg);border:none;
  border-radius:10px;font-size:12px;font-weight:600;
  color:var(--text);cursor:pointer;transition:all .2s;
  box-shadow:
    4px 4px 8px rgba(163,177,198,0.5),
    -4px -4px 8px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .setting-btns button{
  box-shadow:
    3px 3px 6px rgba(0,0,0,0.4),
    -3px -3px 6px rgba(45,52,80,0.2);
}
.setting-btns button:hover{
  box-shadow:
    6px 6px 12px rgba(163,177,198,0.6),
    -6px -6px 12px rgba(255,255,255,0.9);
  transform:scale(1.05);
}
html[data-theme="dark"] .setting-btns button:hover{
  box-shadow:
    5px 5px 10px rgba(0,0,0,0.5),
    -5px -5px 10px rgba(45,52,80,0.3);
  transform:scale(1.05);
}
.setting-btns button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:
    4px 4px 8px rgba(102,126,234,0.4),
    -2px -2px 4px rgba(255,255,255,0.2);
}
html[data-theme="dark"] .setting-btns button.active{
  box-shadow:
    3px 3px 6px rgba(99,102,241,0.5),
    -2px -2px 4px rgba(139,92,246,0.3);
}

/* Main Grid */
.main-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}
@media(max-width:1200px){
  .main-grid{grid-template-columns:1fr 1fr}
  .col-center{grid-column:span 2}
}
@media(max-width:768px){
  .main-grid{grid-template-columns:1fr}
  .col-center{grid-column:span 1}
}

.col-left,.col-center,.col-right{display:flex;flex-direction:column;gap:24px}

/* Card */
.card{
  background:var(--bg);
  border-radius:28px;
  padding:32px;
  transition:all .3s;
  box-shadow:
    10px 10px 20px rgba(163,177,198,0.6),
    -10px -10px 20px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .card{
  box-shadow:
    8px 8px 16px rgba(0,0,0,0.4),
    -8px -8px 16px rgba(45,52,80,0.25);
}
.card-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.8px;
  color:var(--text-light);
  font-weight:700;
  margin-bottom:24px;
}

/* Temperature Display */
.temp-display{text-align:center;padding:60px 20px 40px}
.temp-value{
  font-size:120px;font-weight:200;line-height:1;
  letter-spacing:-3px;color:var(--text-dark);
  text-shadow:
    3px 3px 6px rgba(163,177,198,0.3),
    -2px -2px 4px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .temp-value{
  text-shadow:
    2px 2px 4px rgba(0,0,0,0.5),
    -1px -1px 2px rgba(45,52,80,0.3);
}
.temp-unit{font-size:48px;color:var(--text);margin-left:6px}
.temp-label{font-size:13px;color:var(--text-light);margin-top:20px;
  font-weight:600;letter-spacing:1px;text-transform:uppercase}
.temp-range{font-size:12px;color:var(--text-light);margin-top:8px}

.temp-bar{
  height:14px;border-radius:7px;margin-top:32px;
  background:var(--bg);overflow:hidden;
  box-shadow:
    inset 3px 3px 6px rgba(163,177,198,0.5),
    inset -3px -3px 6px rgba(255,255,255,0.7);
}
html[data-theme="dark"] .temp-bar{
  box-shadow:
    inset 3px 3px 6px rgba(0,0,0,0.5),
    inset -3px -3px 6px rgba(45,52,80,0.2);
}
.temp-bar-fill{
  height:100%;width:0;border-radius:7px;
  transition:width .8s ease,background .4s;
  box-shadow:2px 2px 4px rgba(102,126,234,0.3);
}
html[data-theme="dark"] .temp-bar-fill{
  box-shadow:2px 2px 4px rgba(99,102,241,0.4);
}

/* Gauge - Circular */
.gauge-wrap{
  width:280px;height:280px;margin:20px auto;
  position:relative;border-radius:50%;
  background:var(--bg);
  box-shadow:
    14px 14px 28px rgba(163,177,198,0.6),
    -14px -14px 28px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .gauge-wrap{
  box-shadow:
    10px 10px 20px rgba(0,0,0,0.5),
    -10px -10px 20px rgba(45,52,80,0.3);
}
.gauge-inner{
  position:absolute;top:24px;left:24px;
  width:232px;height:232px;border-radius:50%;
  background:var(--bg);
  box-shadow:
    inset 10px 10px 20px rgba(163,177,198,0.5),
    inset -10px -10px 20px rgba(255,255,255,0.7);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
html[data-theme="dark"] .gauge-inner{
  box-shadow:
    inset 8px 8px 16px rgba(0,0,0,0.5),
    inset -8px -8px 16px rgba(45,52,80,0.2);
}
.gauge-value{
  font-size:64px;font-weight:700;line-height:1;
  color:var(--text-dark);
}
.gauge-unit{font-size:24px;color:var(--text);margin-left:4px}
.gauge-label{
  font-size:11px;color:var(--text-light);margin-top:14px;
  font-weight:600;letter-spacing:1px;text-transform:uppercase;
}
.gauge-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(
    from 270deg,
    var(--accent) 0deg,
    var(--accent2) var(--gauge-deg,180deg),
    transparent var(--gauge-deg,180deg)
  );
  -webkit-mask:radial-gradient(transparent 100px,black 100px);
  mask:radial-gradient(transparent 100px,black 100px);
}

/* Control Buttons */
.preset-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:20px;
}
.preset-btn{
  padding:18px 16px;background:var(--bg);border:none;
  border-radius:16px;font-size:14px;font-weight:600;
  color:var(--text);cursor:pointer;transition:all .3s;
  box-shadow:
    6px 6px 12px rgba(163,177,198,0.6),
    -6px -6px 12px rgba(255,255,255,0.8);
}
html[data-theme="dark"] .preset-btn{
  box-shadow:
    5px 5px 10px rgba(0,0,0,0.4),
    -5px -5px 10px rgba(45,52,80,0.25);
}
.preset-btn:hover{
  box-shadow:
    8px 8px 16px rgba(163,177,198,0.7),
    -8px -8px 16px rgba(255,255,255,0.9);
  transform:translateY(-2px);
}
html[data-theme="dark"] .preset-btn:hover{
  box-shadow:
    7px 7px 14px rgba(0,0,0,0.5),
    -7px -7px 14px rgba(45,52,80,0.3);
  transform:translateY(-2px);
}
.preset-btn:active{
  box-shadow:
    inset 5px 5px 10px rgba(163,177,198,0.6),
    inset -5px -5px 10px rgba(255,255,255,0.5);
  transform:translateY(0);
}
html[data-theme="dark"] .preset-btn:active{
  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,0.5),
    inset -4px -4px 8px rgba(45,52,80,0.2);
  transform:translateY(0);
}
.preset-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  box-shadow:
    6px 6px 12px rgba(102,126,234,0.4),
    -4px -4px 8px rgba(255,255,255,0.2);
}
html[data-theme="dark"] .preset-btn.active{
  box-shadow:
    5px 5px 10px rgba(99,102,241,0.4),
    -3px -3px 6px rgba(139,92,246,0.3);
}

/* Slider */
.slider-wrap{margin:24px 0}
input[type=range]{
  -webkit-appearance:none;width:100%;height:12px;
  background:var(--bg);border-radius:6px;outline:none;
  box-shadow:
    inset 3px 3px 6px rgba(163,177,198,0.5),
    inset -3px -3px 6px rgba(255,255,255,0.7);
}
html[data-theme="dark"] input[type=range]{
  box-shadow:
    inset 3px 3px 6px rgba(0,0,0,0.5),
    inset -3px -3px 6px rgba(45,52,80,0.2);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;
  background:var(--bg);border-radius:50%;cursor:pointer;
  box-shadow:
    4px 4px 8px rgba(163,177,198,0.6),
    -4px -4px 8px rgba(255,255,255,0.8);
  transition:all .2s;
}
html[data-theme="dark"] input[type=range]::-webkit-slider-thumb{
  box-shadow:
    4px 4px 8px rgba(0,0,0,0.4),
    -4px -4px 8px rgba(45,52,80,0.25);
}
input[type=range]::-webkit-slider-thumb:hover{
  box-shadow:
    6px 6px 12px rgba(163,177,198,0.7),
    -6px -6px 12px rgba(255,255,255,0.9);
  transform:scale(1.1);
}
html[data-theme="dark"] input[type=range]::-webkit-slider-thumb:hover{
  box-shadow:
    5px 5px 10px rgba(0,0,0,0.5),
    -5px -5px 10px rgba(45,52,80,0.3);
  transform:scale(1.1);
}
input[type=range]::-webkit-slider-thumb:active{
  box-shadow:
    inset 3px 3px 6px rgba(163,177,198,0.6),
    inset -3px -3px 6px rgba(255,255,255,0.5);
}
html[data-theme="dark"] input[type=range]::-webkit-slider-thumb:active{
  box-shadow:
    inset 3px 3px 6px rgba(0,0,0,0.5),
    inset -3px -3px 6px rgba(45,52,80,0.2);
}
input[type=range]::-moz-range-thumb{
  width:28px;height:28px;background:var(--bg);
  border:none;border-radius:50%;cursor:pointer;
  box-shadow:
    4px 4px 8px rgba(163,177,198,0.6),
    -4px -4px 8px rgba(255,255,255,0.8);
}
html[data-theme="dark"] input[type=range]::-moz-range-thumb{
  box-shadow:
    4px 4px 8px rgba(0,0,0,0.4),
    -4px -4px 8px rgba(45,52,80,0.25);
}
.slider-labels{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--text-light);margin-top:10px;
  font-weight:600;
}

/* Apply Button */
.apply-btn{
  width:100%;padding:18px;margin-top:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:16px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all .3s;letter-spacing:0.5px;
  box-shadow:
    6px 6px 12px rgba(102,126,234,0.4),
    -4px -4px 8px rgba(255,255,255,0.2);
}
html[data-theme="dark"] .apply-btn{
  box-shadow:
    5px 5px 10px rgba(99,102,241,0.4),
    -3px -3px 6px rgba(139,92,246,0.3);
}
.apply-btn:hover{
  box-shadow:
    8px 8px 16px rgba(102,126,234,0.5),
    -6px -6px 12px rgba(255,255,255,0.3);
  transform:translateY(-2px);
}
html[data-theme="dark"] .apply-btn:hover{
  box-shadow:
    7px 7px 14px rgba(99,102,241,0.5),
    -5px -5px 10px rgba(139,92,246,0.4);
  transform:translateY(-2px);
}
.apply-btn:active{
  box-shadow:
    inset 4px 4px 8px rgba(102,126,234,0.6),
    inset -4px -4px 8px rgba(118,75,162,0.4);
  transform:translateY(0);
}
html[data-theme="dark"] .apply-btn:active{
  box-shadow:
    inset 4px 4px 8px rgba(99,102,241,0.6),
    inset -4px -4px 8px rgba(139,92,246,0.4);
  transform:translateY(0);
}
.apply-btn:disabled{
  opacity:.6;cursor:not-allowed;
  transform:none;
}

/* Widget Small */
.widget-small{padding:28px}
.widget-header{
  display:flex;justify-content:space-between;
  align-items:flex-start;margin-bottom:20px;
}
.widget-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;
  box-shadow:
    5px 5px 10px rgba(102,126,234,0.4),
    -3px -3px 6px rgba(255,255,255,0.2);
}
html[data-theme="dark"] .widget-icon{
  box-shadow:
    4px 4px 8px rgba(99,102,241,0.5),
    -2px -2px 4px rgba(139,92,246,0.3);
}
.widget-value{
  font-size:36px;font-weight:700;line-height:1;
  margin-bottom:12px;color:var(--text-dark);
}
.widget-label{
  font-size:13px;color:var(--text-light);
  font-weight:600;letter-spacing:0.5px;
}
.widget-sub{
  font-size:12px;color:var(--text-light);
  margin-top:8px;
}

/* RPM Card */
.rpm-card{padding:24px}
.rpm-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:16px;
}
.rpm-channel{
  font-size:10px;color:var(--accent);
  font-weight:700;letter-spacing:1.5px;
}
.rpm-name{
  font-size:13px;color:var(--text-light);
  font-weight:600;margin-top:4px;
}
.rpm-value{
  font-size:42px;font-weight:700;line-height:1;
  margin-bottom:16px;color:var(--text-dark);
}
.rpm-value small{
  font-size:14px;color:var(--text);
  margin-left:6px;font-weight:500;
}
.rpm-bar{
  height:10px;border-radius:5px;
  background:var(--bg);overflow:hidden;
  box-shadow:
    inset 3px 3px 6px rgba(163,177,198,0.5),
    inset -3px -3px 6px rgba(255,255,255,0.7);
}
html[data-theme="dark"] .rpm-bar{
  box-shadow:
    inset 3px 3px 6px rgba(0,0,0,0.5),
    inset -3px -3px 6px rgba(45,52,80,0.2);
}
.rpm-bar-fill{
  height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .8s ease;
  box-shadow:1px 1px 3px rgba(102,126,234,0.4);
}
html[data-theme="dark"] .rpm-bar-fill{
  box-shadow:1px 1px 3px rgba(99,102,241,0.5);
}

/* Footer */
.footer{
  text-align:center;margin-top:32px;
  padding-top:20px;
  font-size:11px;color:var(--text-light);
}

.offline .controls{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <div class="logo-text">
        <span data-zh="VALKYRIE C360" data-en="VALKYRIE C360">VALKYRIE C360</span>
        <small data-zh="水冷控制终端" data-en="Cooling Control">水冷控制终端</small>
      </div>
    </div>
    <div class="header-right">
      <div class="status-chip">
        <span class="status-dot wait" id="statusDot"></span>
        <span id="statusText" data-zh="连接中" data-en="Connecting">连接中</span>
      </div>
      <button class="settings-btn" id="settingsBtn">⚙</button>
    </div>
  </header>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <div class="setting-label" data-zh="语言" data-en="Language">语言</div>
      <div class="setting-btns" id="langBtns">
        <button data-v="zh">中文</button>
        <button data-v="en">EN</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label" data-zh="主题" data-en="Theme">主题</div>
      <div class="setting-btns" id="themeBtns">
        <button data-v="light" data-zh="浅色" data-en="Light">浅色</button>
        <button data-v="dark" data-zh="深色" data-en="Dark">深色</button>
      </div>
    </div>
    <div class="setting-row">
      <div class="setting-label" data-zh="采样率" data-en="Sample">采样率</div>
      <div class="setting-btns" id="rateBtns">
        <button data-v="1">1s</button>
        <button data-v="2">2s</button>
        <button data-v="5">5s</button>
      </div>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="main-grid">
    <!-- Left Column - Temperature & Status -->
    <div class="col-left">
      <!-- Temperature -->
      <div class="card">
        <div class="temp-display">
          <div class="temp-value" id="tempValue">
            --<span class="temp-unit">°C</span>
          </div>
          <div class="temp-label" data-zh="冷却液温度" data-en="COOLANT TEMP">冷却液温度</div>
          <div class="temp-range">60 — 150°C</div>
        </div>
        <div class="temp-bar">
          <div class="temp-bar-fill" id="tempBar"></div>
        </div>
      </div>

      <!-- System Status -->
      <div class="card widget-small">
        <div class="widget-header">
          <div>
            <div class="card-title" style="margin:0" data-zh="系统状态" data-en="SYSTEM">系统状态</div>
          </div>
          <div class="widget-icon">📡</div>
        </div>
        <div class="widget-value" id="deviceStatus" style="color:var(--amber)">--</div>
        <div class="widget-label">HID 0416:5201</div>
        <div class="widget-sub">
          <span data-zh="采样间隔" data-en="Sample">采样间隔</span>: <span id="sampleRate">2s</span>
        </div>
      </div>
    </div>

    <!-- Center Column - Speed Control -->
    <div class="col-center">
      <!-- Speed Gauge -->
      <div class="card">
        <div class="card-title" data-zh="转速控制" data-en="SPEED CONTROL">转速控制</div>
        <div class="gauge-wrap">
          <div class="gauge-ring" id="gaugeRing"></div>
          <div class="gauge-inner">
            <div class="gauge-value">
              <span id="gaugeVal">50</span><span class="gauge-unit">%</span>
            </div>
            <div class="gauge-label" data-zh="PWM 占空比" data-en="PWM DUTY">PWM 占空比</div>
          </div>
        </div>
      </div>

      <!-- Presets & Slider -->
      <div class="card controls" id="controls">
        <div class="card-title" data-zh="快速预设" data-en="PRESETS">快速预设</div>
        <div class="preset-grid">
          <button class="preset-btn" data-speed="30">
            <span data-zh="安静 30%" data-en="Silent 30%">安静 30%</span>
          </button>
          <button class="preset-btn active" data-speed="50">
            <span data-zh="平衡 50%" data-en="Balanced 50%">平衡 50%</span>
          </button>
          <button class="preset-btn" data-speed="75">
            <span data-zh="性能 75%" data-en="Performance 75%">性能 75%</span>
          </button>
          <button class="preset-btn" data-speed="100">
            <span data-zh="满速 100%" data-en="Maximum 100%">满速 100%</span>
          </button>
        </div>
        <div class="slider-wrap">
          <input type="range" id="speedSlider" min="0" max="100" value="50"/>
          <div class="slider-labels">
            <span>0%</span>
            <span data-zh="手动调节" data-en="Manual">手动调节</span>
            <span>100%</span>
          </div>
        </div>
        <button class="apply-btn" id="applyBtn">
          <span data-zh="应用设置" data-en="APPLY SETTINGS">应用设置</span>
        </button>
      </div>
    </div>

    <!-- Right Column - RPM Monitors -->
    <div class="col-right">
      <!-- Pump RPM -->
      <div class="card rpm-card">
        <div class="rpm-header">
          <div>
            <div class="rpm-channel">CH-1</div>
            <div class="rpm-name" data-zh="水泵" data-en="Pump">水泵</div>
          </div>
        </div>
        <div class="rpm-value" id="pumpRpm">----<small>RPM</small></div>
        <div class="rpm-bar">
          <div class="rpm-bar-fill" id="pumpBar"></div>
        </div>
      </div>

      <!-- Fan 1 -->
      <div class="card rpm-card">
        <div class="rpm-header">
          <div>
            <div class="rpm-channel">CH-2</div>
            <div class="rpm-name" data-zh="风扇 1" data-en="Fan 1">风扇 1</div>
          </div>
        </div>
        <div class="rpm-value" id="fan1Rpm">----<small>RPM</small></div>
        <div class="rpm-bar">
          <div class="rpm-bar-fill" id="fan1Bar"></div>
        </div>
      </div>

      <!-- Fan 2 -->
      <div class="card rpm-card">
        <div class="rpm-header">
          <div>
            <div class="rpm-channel">CH-3</div>
            <div class="rpm-name" data-zh="风扇 2" data-en="Fan 2">风扇 2</div>
          </div>
        </div>
        <div class="rpm-value" id="fan2Rpm">----<small>RPM</small></div>
        <div class="rpm-bar">
          <div class="rpm-bar-fill" id="fan2Bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    VALKYRIE C360 // <span data-zh="水冷控制终端" data-en="Cooling Control Terminal">水冷控制终端</span> v1.0
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const MAX_RPM = 2000, TEMP_LO = 40, TEMP_HI = 160;
let applying = false, currentSpeed = 50;

/* Translations */
const T = {
  online:  {zh:'已连接',   en:'Online'},
  offline: {zh:'未连接',   en:'Offline'},
  linking: {zh:'连接中',  en:'Connecting'},
  applying:{zh:'应用中',  en:'Applying'},
};

/* Storage (localStorage 不可用时降级为内存存储 fallback to memory) */
const store = (()=>{
  const mem = {};
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e) {}
  return {
    get:(k,d)=>{
      if (ok){ const v = localStorage.getItem('vk_'+k); return v===null?d:v; }
      return (k in mem) ? mem[k] : d;
    },
    set:(k,v)=>{
      if (ok){ localStorage.setItem('vk_'+k,v); } else { mem[k]=v; }
    },
  };
})();
let lang  = store.get('lang','zh');
let theme = store.get('theme','light');
let rate  = parseFloat(store.get('rate','2'));

/* Language */
function applyLang(){
  document.querySelectorAll('[data-zh]').forEach(el=>{
    el.textContent = (lang==='zh') ? el.dataset.zh : el.dataset.en;
  });
  syncButtons('#langBtns', lang);
  updateStatus();
}

/* Theme */
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  syncButtons('#themeBtns', theme);
}

/* Sample Rate */
let pollTimer = null;
function restartPoll(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, rate * 1000);
}
async function applyRate(push){
  syncButtons('#rateBtns', String(rate));
  $('#sampleRate').textContent = rate + 's';
  store.set('rate', rate);
  restartPoll();
  if (push){
    try {
      await fetch('/api/config', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({interval: rate})
      });
    } catch(e) {}
  }
}

/* Settings Panel */
function syncButtons(sel, val){
  document.querySelectorAll(sel + ' button').forEach(b=>{
    b.classList.toggle('active', b.dataset.v === val);
  });
}
$('#settingsBtn').addEventListener('click', e=>{
  e.stopPropagation();
  $('#settingsPanel').classList.toggle('open');
});
$('#settingsPanel').addEventListener('click', e=>e.stopPropagation());
document.addEventListener('click', ()=>$('#settingsPanel').classList.remove('open'));

$('#langBtns').addEventListener('click', e=>{
  const v = e.target.dataset.v; if (!v) return;
  lang = v; store.set('lang', v); applyLang();
});
$('#themeBtns').addEventListener('click', e=>{
  const v = e.target.dataset.v; if (!v) return;
  theme = v; store.set('theme', v); applyTheme();
});
$('#rateBtns').addEventListener('click', e=>{
  const v = e.target.dataset.v; if (!v) return;
  rate = parseFloat(v); applyRate(true);
});

/* Temperature Color */
function tempColor(t){
  if (t < 120) return 'linear-gradient(90deg, #667eea, #764ba2)';
  if (t <= 150) return 'linear-gradient(90deg, #f093fb, #f5576c)';
  return 'linear-gradient(90deg, #fa709a, #fee140)';
}

/* Update Status */
function updateStatus(){
  const dot = $('#statusDot');
  const txt = $('#statusText');
  const widget = $('#deviceStatus');

  if (dot.classList.contains('wait')){
    txt.textContent = T.linking[lang];
    widget.textContent = T.linking[lang];
    widget.style.color = 'var(--amber)';
  } else if (dot.classList.contains('on')){
    txt.textContent = T.online[lang];
    widget.textContent = T.online[lang];
    widget.style.color = 'var(--green)';
  } else {
    txt.textContent = T.offline[lang];
    widget.textContent = T.offline[lang];
    widget.style.color = 'var(--red)';
  }
}

/* Render Data */
function render(d){
  const online = !!d.connected;
  document.body.classList.toggle('offline', !online);

  const dot = $('#statusDot');
  dot.className = 'status-dot ' + (online ? 'on' : 'off');
  updateStatus();

  if (online && d.temp_c != null){
    const color = tempColor(d.temp_c);
    $('#tempValue').innerHTML = d.temp_c.toFixed(1) + '<span class="temp-unit">°C</span>';

    const frac = Math.min(Math.max((d.temp_c - TEMP_LO) / (TEMP_HI - TEMP_LO), 0), 1);
    const bar = $('#tempBar');
    bar.style.width = (frac * 100).toFixed(1) + '%';
    bar.style.background = color;

    setRpm('#pumpRpm', '#pumpBar', d.pump_rpm);
    setRpm('#fan1Rpm', '#fan1Bar', d.fan1_rpm);
    setRpm('#fan2Rpm', '#fan2Bar', d.fan2_rpm);
  } else {
    $('#tempValue').innerHTML = '--<span class="temp-unit">°C</span>';
    $('#tempBar').style.width = '0%';
    setRpm('#pumpRpm', '#pumpBar', null);
    setRpm('#fan1Rpm', '#fan1Bar', null);
    setRpm('#fan2Rpm', '#fan2Bar', null);
  }
}

function setRpm(valSel, barSel, rpm){
  $(valSel).innerHTML = (rpm == null ? '----' : rpm) + '<small>RPM</small>';
  $(barSel).style.width = rpm == null ? '0%' : Math.min(rpm / MAX_RPM * 100, 100).toFixed(1) + '%';
}

/* Polling */
async function poll(){
  try {
    const r = await fetch('/api/status');
    render(await r.json());
  } catch (e) {
    render({connected:false});
  }
}

/* Apply Speed */
async function postSpeed(v){
  if (applying) return;
  applying = true;
  const btn = $('#applyBtn');
  btn.disabled = true;
  btn.textContent = T.applying[lang];
  try {
    await fetch('/api/speed', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({speed:v})
    });
  } catch(e) {}
  btn.disabled = false;
  btn.innerHTML = '<span data-zh="应用设置" data-en="APPLY SETTINGS">' +
                  (lang === 'zh' ? '应用设置' : 'APPLY SETTINGS') + '</span>';
  applying = false;
}

/* Gauge Update */
function updateGauge(v){
  const deg = (v / 100) * 360;
  $('#gaugeRing').style.setProperty('--gauge-deg', deg + 'deg');
}

/* Control Events */
function syncPresets(v){
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.speed === v);
  });
}

$('#speedSlider').addEventListener('input', e => {
  currentSpeed = +e.target.value;
  $('#gaugeVal').textContent = currentSpeed;
  updateGauge(currentSpeed);
  syncPresets(currentSpeed);
});

document.querySelectorAll('.preset-btn').forEach(b => {
  b.addEventListener('click', () => {
    currentSpeed = +b.dataset.speed;
    $('#speedSlider').value = currentSpeed;
    $('#gaugeVal').textContent = currentSpeed;
    updateGauge(currentSpeed);
    syncPresets(currentSpeed);
    postSpeed(currentSpeed);
  });
});

$('#applyBtn').addEventListener('click', () => postSpeed(currentSpeed));

/* Init */
applyTheme();
applyLang();
applyRate(true);
updateGauge(currentSpeed);
poll();
</script>
</body>
</html>
